    name: Update GitHub Stats Card
    
    on:
      schedule:
        # Runs every day at midnight UTC
        - cron: '0 0 * * *'
      workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
    
    permissions:
      contents: write
    
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
    
          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.11'
    
          - name: Generate updated SVG card
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              python github_card.py --user krzysztof-nowicki --out github_card.svg
              # If output is saved in output/, move it:
              if [ -f "output/github_card.svg" ]; then
                mv output/github_card.svg github_card.svg
              fi

          - name: Commit and push changes
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add github_card.svg
              git diff --staged --quiet || git commit -m "chore: update profile stats card [skip ci]"
              git push

